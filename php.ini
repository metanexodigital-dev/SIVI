; DOCUMENTACIÓN TÉCNICA EN ESPAÑOL
; Archivo: php.ini
; Propósito: Configura los límites, sesiones, registros y opciones de PHP utilizadas por SIVI.
upload_max_filesize=150M
post_max_size=160M
memory_limit=768M
max_execution_time=900
max_input_time=900
max_file_uploads=20
default_charset=UTF-8
output_buffering=4096
realpath_cache_size=8192K
realpath_cache_ttl=600

session.cookie_httponly=1
session.cookie_samesite=Lax
session.use_strict_mode=1
session.use_only_cookies=1
session.lazy_write=1

expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.jit=off

; Reduce instrumentación innecesaria de mysqlnd en producción.
mysqlnd.collect_statistics=0
mysqlnd.collect_memory_statistics=0

session.use_trans_sid=0
session.cache_limiter=nocache
allow_url_include=Off
cgi.fix_pathinfo=0
zend.exception_ignore_args=On
mail.add_x_header=Off
